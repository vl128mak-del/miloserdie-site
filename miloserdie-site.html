<body>

<button class="menu-btn" id="mb" aria-label="Меню"><span></span><span></span><span></span></button>

<nav id="nav">

  <a href="#" data-page="attendance">Посещаемость</a>
  <a href="#" data-page="admin">Админ</a>
</nav>

<!-- Здесь хранятся данные таблицы -->
<script type="application/json" id="state">[]</script>

<main>
  <section class="page active" id="home">
    <h1>Добро пожаловать в команду милосердие</h1>

    <div id="loginBox">

      <input type="password" id="pass" placeholder="Введите пароль">
      <div class="msg" id="err" style="color:#b00020"></div>
      <button class="btn" id="loginBtn">Войти</button>
    </div>
    <div id="editBox" style="display:none">
      <h2>Редактирование таблицы</h2>
      <div class="card"><table id="editTable"></table></div>
      <div class="msg" id="saveMsg"></div>
      <button class="btn" id="addRow">+ Добавить строку</button>
      <button class="btn" id="saveBtn">Сохранить</button>
      <button class="btn gray" id="logoutBtn">Выйти</button>
    </div>

[12.10.2026 22:55] Заметки: <script>
  const PASSWORD = "11220099";
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

  let rows = [];
  try { rows = JSON.parse($("state").textContent) || []; } catch (e) {}
  let buf = [], isAdmin = false;
  const nav = $("nav");

  function showPage(id) {
    document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
    $(id).classList.add("active");
    nav.classList.remove("open");
    if (id === "attendance") renderView();
    if (id === "admin") adminView();
  }
  $("mb").onclick = () => nav.classList.toggle("open");
  nav.querySelectorAll("a").forEach(a => a.onclick = e => { e.preventDefault(); showPage(a.dataset.page); });

  function renderView() {
    $("viewTable").innerHTML = "<tr><th>Имя</th><th>Посещено</th></tr>" +
      rows.map(r => <tr><td>${esc(r.name)}</td><td>${esc(r.visits)}</td></tr>).join("");
    $("viewMsg").textContent = rows.length ? "" : "Пока нет данных.";
  }

  function renderEdit() {
    const t = $("editTable");
    t.innerHTML = "<tr><th>Имя</th><th>Посещено</th><th></th></tr>";
    buf.forEach((r, i) => {
      const tr = document.createElement("tr");
      tr.innerHTML = <td><input value="${esc(r.name)}" data-i="${i}" data-f="name"></td>
        <td><input value="${esc(r.visits)}" data-i="${i}" data-f="visits"></td>
        <td><button class="btn red" data-del="${i}">✕</button></td>;
      t.appendChild(tr);
    });
    t.querySelectorAll("input").forEach(x => x.oninput = () => { buf[x.dataset.i][x.dataset.f] = x.value; });
    t.querySelectorAll("[data-del]").forEach(b => b.onclick = () => { buf.splice(b.dataset.del, 1); renderEdit(); });
  }

  function adminView() {
    $("loginBox").style.display = isAdmin ? "none" : "block";
    $("editBox").style.display = isAdmin ? "block" : "none";
    if (isAdmin) { buf = rows.map(r => ({ name: r.name, visits: r.visits })); renderEdit(); }
  }

  function login() {
    if ($("pass").value === PASSWORD) {
      isAdmin = true; $("pass").value = ""; $("err").textContent = ""; adminView();
    } else $("err").textContent = "Неверный пароль";
  }
  $("loginBtn").onclick = login;
  $("pass").onkeydown = e => { if (e.key === "Enter") login(); };
  $("logoutBtn").onclick = () => { isAdmin = false; adminView(); };
  $("addRow").onclick = () => { buf.push({ name: "", visits: "" }); renderEdit(); };

  // Собирает новую версию страницы с обновлёнными данными
  function buildHtml(data) {
    const c = document.documentElement.cloneNode(true);
    c.querySelector("#state").textContent = JSON.stringify(data).replace(/</g, "\\u003c");
    c.querySelector("#viewTable").innerHTML = "";
    c.querySelector("#editTable").innerHTML = "";
    c.querySelector("#viewMsg").textContent = "";
    c.querySelector("#saveMsg").textContent = "";
    c.querySelector("#err").textContent = "";
    c.querySelectorAll(".page").forEach(p => p.classList.toggle("active", p.id === "home"));
    c.querySelector("#nav").classList.remove("open");
    c.querySelector("#loginBox").removeAttribute("style");
    c.querySelector("#editBox").setAttribute("style", "display:none");
    c.querySelector("#pass").removeAttribute("value");
    return "<!DOCTYPE html>\n" + c.outerHTML;
  }

  // Сохранение работает только на claude.ai (через функцию публикации)
  $("saveBtn").onclick = async () => {
    const m = $("saveMsg");
    m.textContent = "Сохранение...";
    try {
      const a = await claude.use("artifact");
      if (!a) { m.textContent = "Сохранение недоступно в этом режиме."; return; }
      await a.publish(buildHtml(buf));
    } catch (e) {
      m.textContent = "Не удалось сохранить: нет прав на изменение страницы.";
      console.error(e);
    }
  };
</script>

</body>
</html>
